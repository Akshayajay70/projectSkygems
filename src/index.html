<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKY</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        padding: 40px 20px;
      }

      .container {
        width: 100%;
        max-width: 700px;
        text-align: center;
      }

      h1 {
        font-size: 4rem;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #94a3b8;
        margin-bottom: 50px;
      }

      .sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .section {
        padding: 25px;
        background: #111c31;
        border: 1px solid #26344d;
        border-radius: 16px;
      }

      .section h2 {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .websites {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .website-btn {
        display: block;
        padding: 15px 20px;
        border-radius: 10px;
        background: #1e293b;
        color: white;
        text-decoration: none;
        font-size: 18px;
        border: 1px solid #334155;
        transition: 0.2s ease;
      }

      .website-btn:hover {
        background: #334155;
        transform: translateY(-2px);
      }

      /* Mobile */
      @media (max-width: 600px) {
        .sections {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 3rem;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <h1>SKY</h1>
      <p class="subtitle">Select a website</p>

      <div class="sections">
        <!-- Normal Websites -->
        <section class="section">
          <h2>Normal</h2>

          <div class="websites">
            <a
              class="website-btn"
              href="./components/stitch.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Website One
            </a>
          </div>
        </section>

        <!-- Animated Websites -->
        <section class="section">
          <h2>Animated</h2>

          <div class="websites">
            <a
              class="website-btn"
              href="./components/gsap.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Website One
            </a>

            <a
              class="website-btn"
              href="./components/chatgpt/index.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Website Two
            </a>

            <a
              class="website-btn"
              href="./components/chatgpt.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Website three
            </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
